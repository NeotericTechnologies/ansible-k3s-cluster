---
# HA disruption resilience test for critical component subset.
# Measures success ratio using external probes and enforces SC-003 threshold.
# This playbook does not stop, reboot, evict, or otherwise disrupt a node.
# Start the intended single-node disruption separately while this probe window runs.

- name: HA Disruption Resilience Test
  hosts: k3s_servers[0]
  gather_facts: false
  tasks:
    - name: Load shared HA disruption defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../ansible/group_vars/all.yml"
        name: smoke_defaults

    - name: Resolve disruption timing thresholds
      ansible.builtin.set_fact:
        disruption_window_seconds: "{{ smoke_defaults.ha_disruption_window_seconds | default(600) | int }}"
        probe_rps: "{{ smoke_defaults.ha_probe_requests_per_second | default(1) | int }}"
        availability_threshold: "{{ smoke_defaults.ha_probe_min_availability_percent | default(99.0) | float }}"

    - name: Determine HA topology for disruption test
      ansible.builtin.set_fact:
        disruption_server_count: "{{ groups['k3s_servers'] | default([]) | length }}"
        disruption_is_ha: "{{ (groups['k3s_servers'] | default([]) | length) >= 3 }}"

    - name: Skip disruption validation outside HA topology
      ansible.builtin.meta: end_play
      when: not disruption_is_ha | bool

    - name: Ensure critical probes are defined
      ansible.builtin.assert:
        that:
          - smoke_defaults.critical_component_subset | default([]) | length > 0
          - smoke_defaults.critical_component_probes is mapping
        fail_msg: "critical_component_subset and critical_component_probes must be defined for disruption tests"

    - name: Calculate total probes per component
      ansible.builtin.set_fact:
        total_probes_per_component: "{{ disruption_window_seconds * probe_rps }}"

    - name: Resolve control-plane VIP from kube-vip
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
        -n kube-system get daemonset kube-vip
        -o json
      register: control_plane_daemonset
      changed_when: false
      when: "'k3s-control-plane' in smoke_defaults.critical_component_subset"

    - name: Extract control-plane VIP from kube-vip configuration
      ansible.builtin.set_fact:
        control_plane_probe_address: >-
          {{ ((control_plane_daemonset.stdout | from_json).spec.template.spec.containers[0].env
              | selectattr('name', 'equalto', 'address')
              | map(attribute='value') | first | default('')) }}
      when: "'k3s-control-plane' in smoke_defaults.critical_component_subset"

    - name: Ensure control-plane VIP probe endpoint is available
      ansible.builtin.assert:
        that:
          - control_plane_probe_address | default('') | length > 0
        fail_msg: "kube-vip has no configured control-plane VIP for disruption probing"
      when: "'k3s-control-plane' in smoke_defaults.critical_component_subset"

    - name: Resolve Traefik LoadBalancer probe endpoint
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
        -n kube-system get service traefik
        -o jsonpath={.status.loadBalancer.ingress[0].ip}
      register: traefik_probe_address
      changed_when: false
      when: "'traefik' in smoke_defaults.critical_component_subset"

    - name: Ensure Traefik LoadBalancer probe endpoint is available
      ansible.builtin.assert:
        that:
          - traefik_probe_address.stdout | default('') | length > 0
        fail_msg: "Traefik LoadBalancer service has no external IP for disruption probing"
      when: "'traefik' in smoke_defaults.critical_component_subset"

    - name: Execute probe loop per critical component
      ansible.builtin.shell: |
        set -eu
        success=0
        total={{ total_probes_per_component }}
        url="{{ smoke_defaults.critical_component_probes[item].url }}"
        if [[ "{{ item }}" == "k3s-control-plane" ]]; then
          url="https://{{ control_plane_probe_address }}:{{ api_port | default(6443) }}/healthz"
        fi
        if [[ "{{ item }}" == "traefik" ]]; then
          url="http://{{ traefik_probe_address.stdout }}"
        fi
        insecure="{{ smoke_defaults.critical_component_probes[item].insecure | default(false) | bool }}"
        for _ in $(seq 1 "$total"); do
          if [[ "$insecure" == "True" ]]; then
            status=$(curl -ksS --max-time 2 -o /dev/null -w "%{http_code}" "$url" 2>/dev/null) || status=000
          else
            status=$(curl -sS --max-time 2 -o /dev/null -w "%{http_code}" "$url" 2>/dev/null) || status=000
          fi
          if [[ "$status" -ge 200 && "$status" -lt 500 ]]; then
            success=$((success+1))
          fi
          sleep 1
        done
        echo "success=${success}"
        echo "total=${total}"
      args:
        executable: /bin/bash
      loop: "{{ smoke_defaults.critical_component_subset }}"
      loop_control:
        label: "{{ item }}"
      register: disruption_probe_results
      changed_when: false

    - name: Compute availability percentages
      ansible.builtin.set_fact:
        disruption_component_availability: >-
          {{ disruption_component_availability | default({}) |
             combine({
               item.item: ((item.stdout_lines | select('search', '^success=') | first | default('success=0') | regex_replace('^success=', '') | int) * 100.0 /
                         (item.stdout_lines | select('search', '^total=') | first | default('total=1') | regex_replace('^total=', '') | int))
             }) }}
      loop: "{{ disruption_probe_results.results }}"

    - name: Display disruption availability summary
      ansible.builtin.debug:
        var: disruption_component_availability

    - name: Enforce SC-003 threshold per critical component
      ansible.builtin.assert:
        that:
          - disruption_component_availability[item] | float >= availability_threshold
        fail_msg: >-
          SC-003 threshold failed for {{ item }}: availability={{ disruption_component_availability[item] | float }}%,
          required={{ availability_threshold }}%
        success_msg: >-
          SC-003 threshold met for {{ item }}: availability={{ disruption_component_availability[item] | float }}%
      loop: "{{ smoke_defaults.critical_component_subset }}"
