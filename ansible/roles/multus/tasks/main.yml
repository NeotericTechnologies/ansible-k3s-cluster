---
# ansible/roles/multus/tasks/main.yml
# Purpose: Deploy multus CNI for VLAN-based secondary networking
# Reference: FR-006

- name: Include multus installation tasks
  ansible.builtin.include_tasks:
    file: install.yml
    apply:
      tags:
        - install
        - multus
  when: multus_enabled | default(false)
  tags:
    - install
    - multus
