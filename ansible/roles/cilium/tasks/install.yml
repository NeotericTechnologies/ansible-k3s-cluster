---
# ansible/roles/cilium/tasks/install.yml
# Purpose: Install Cilium CNI via Helm; enable egress gateway datapath when required
# Reference: FR-003c, FR-003a (cilium_egress_gateway_enabled), data-model.md §5

- name: Assert cilium_version is set
  ansible.builtin.assert:
    that:
      - cilium_version is defined
      - cilium_version | length > 0
    fail_msg: "cilium_version must be set to a pinned Cilium version (e.g. 'v1.16.6') — no default is provided"

- name: Auto-enable Cilium egress gateway datapath when kube-vip egress gateway is enabled
  ansible.builtin.set_fact:
    cilium_egress_gateway_enabled: true
  when: kube_vip_egress_enabled | default(false) | bool

- name: Merge egress gateway setting into Cilium Helm values
  ansible.builtin.set_fact:
    # egressGateway has cascading dependencies:
    # - egressGateway.enabled requires masquerade (--enable-ipv4-masquerade) and bpf.masquerade
    # - bpf.masquerade requires nodePort (--enable-node-port)
    # - nodePort + bpf.masquerade require socketLB for proper traffic steering
    # - k3s requires explicit CNI paths so kubelet and Multus read Cilium config
    #   from /var/lib/rancher/k3s/agent/etc/cni/net.d instead of stale Flannel
    #   configs left from prior deployments.
    # NOTE: Do not force autoDirectNodeRoutes here. It is incompatible with
    # routing-mode=tunnel and causes cilium-agent to exit at startup.
    # Operators using native routing can still set it explicitly via cilium_helm_values.
    #
    # Enforce these automatically when egress gateway is enabled. Respect user-supplied overrides.
    cilium_helm_values: >-
      {{
        cilium_helm_values | combine(
          {
            'egressGateway': {'enabled': cilium_egress_gateway_enabled | bool},
            'masquerade': (cilium_egress_gateway_enabled | bool) or (cilium_helm_values.masquerade | default(false) | bool),
            'bpf': {
              'masquerade': (cilium_egress_gateway_enabled | bool) or (cilium_helm_values.bpf.masquerade | default(false) | bool)
            },
            'nodePort': {
              'enabled': (cilium_egress_gateway_enabled | bool) or (cilium_helm_values.nodePort.enabled | default(false) | bool)
            },
            'socketLB': {
              'enabled': (cilium_egress_gateway_enabled | bool) or (cilium_helm_values.socketLB.enabled | default(false) | bool)
            },
            'cni': {
              'confPath': cilium_helm_values.cni.confPath | default(cilium_cni_conf_path),
              'binPath': cilium_helm_values.cni.binPath | default(cilium_cni_bin_path)
            }
          },
          recursive=True
        )
      }}

- name: Remove stale flannel CNI config from k3s CNI directories
  ansible.builtin.file:
    path: "{{ item.0 }}/10-flannel.conflist"
    state: absent
  delegate_to: "{{ item.1 }}"
  loop: "{{ ([cilium_cni_conf_path, '/etc/cni/net.d'] | unique) | product(groups['k3s_servers'] + groups['k3s_agents']) | list }}"

- name: Remove stale flannel VXLAN interface from host network namespace
  ansible.builtin.command:
    cmd: ip link delete {{ item.0 }}
  register: cilium_stale_iface_cleanup
  changed_when: cilium_stale_iface_cleanup.rc == 0
  failed_when: cilium_stale_iface_cleanup.rc != 0 and ('Cannot find device' not in (cilium_stale_iface_cleanup.stderr | default('')))
  delegate_to: "{{ item.1 }}"
  loop: "{{ ['flannel.1'] | product(groups['k3s_servers'] + groups['k3s_agents']) | list }}"

- name: Ensure cilium CNI binaries are discoverable in kubelet plugin directory
  ansible.builtin.file:
    path: "{{ cilium_kubelet_cni_bin_path }}"
    state: directory
    mode: "0755"
  delegate_to: "{{ item }}"
  loop: "{{ groups['k3s_servers'] + groups['k3s_agents'] }}"

- name: Ensure cilium-cni is discoverable in kubelet plugin directory
  ansible.builtin.file:
    src: "{{ cilium_cni_bin_path }}/cilium-cni"
    dest: "{{ cilium_kubelet_cni_bin_path }}/cilium-cni"
    state: link
    force: true
  delegate_to: "{{ item }}"
  loop: "{{ groups['k3s_servers'] + groups['k3s_agents'] }}"

- name: Add Cilium Helm repository
  kubernetes.core.helm_repository:
    name: cilium
    repo_url: "{{ cilium_helm_repo }}"

- name: Deploy Cilium Helm chart
  kubernetes.core.helm:
    name: "{{ cilium_helm_release_name }}"
    chart_ref: cilium/cilium
    # The official Cilium Helm chart is versioned 1:1 with the Cilium app version,
    # but published chart versions omit any leading "v" (e.g. chart "1.16.6" installs
    # Cilium app version v1.16.6). cilium_version documents the actual Cilium version
    # (accepts either "v1.16.6" or "1.16.6") — strip the "v" for the Helm chart lookup.
    chart_version: "{{ cilium_version | regex_replace('^v', '') }}"
    release_namespace: "{{ cilium_namespace }}"
    create_namespace: false
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    values: "{{ cilium_helm_values }}"
    # wait=false avoids Helm's internal context deadline during CNI bootstrap:
    # Cilium IS the CNI, so pods may not be schedulable until Cilium itself is running.
    # Readiness is verified by the explicit k8s_info poll below.
    wait: false
  register: cilium_helm_install

- name: Wait for Cilium DaemonSet to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: DaemonSet
    name: cilium
    namespace: "{{ cilium_namespace }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  register: cilium_ds
  retries: 60
  delay: 10
  until: >-
    (cilium_ds.resources | default([]) | length) > 0 and
    (cilium_ds.resources[0].status.numberReady | default(0) | int) ==
    (cilium_ds.resources[0].status.desiredNumberScheduled | default(-1) | int) and
    (cilium_ds.resources[0].status.desiredNumberScheduled | default(0) | int) > 0
  changed_when: false

- name: Restart multus DaemonSet to pick up Cilium primary CNI config
  ansible.builtin.command:
    cmd: kubectl rollout restart daemonset/kube-multus-ds -n kube-system
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true
  when: multus_enabled | default(false) | bool

- name: Wait for multus DaemonSet to be ready after restart
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: DaemonSet
    name: kube-multus-ds
    namespace: kube-system
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  register: cilium_multus_ds_after_restart
  retries: 30
  delay: 10
  until: >-
    (cilium_multus_ds_after_restart.resources | default([]) | length) > 0 and
    (cilium_multus_ds_after_restart.resources[0].status.numberReady | default(0) | int) ==
    (cilium_multus_ds_after_restart.resources[0].status.desiredNumberScheduled | default(-1) | int) and
    (cilium_multus_ds_after_restart.resources[0].status.desiredNumberScheduled | default(0) | int) > 0
  changed_when: false
  when: multus_enabled | default(false) | bool

# The CiliumEgressGatewayPolicy CRD is only registered once the Cilium Helm chart
# above has installed successfully, so this MUST run after the DaemonSet-ready wait.
# kube_vip_egress_* variables are owned by the kube-vip role but mirrored in
# ansible/group_vars/all.yml, making them available here regardless of role order.
- name: Apply CiliumEgressGatewayPolicy for kube-vip egress gateway
  kubernetes.core.k8s:
    definition: "{{ item }}"
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  loop: "{{ lookup('template', 'cilium-egress-gateway-policy.yaml.j2') | from_yaml_all | list }}"
  loop_control:
    label: "{{ item.kind | default('Resource') }}/{{ item.metadata.name | default('unnamed') }}"
  when:
    - kube_vip_egress_enabled | default(false) | bool
    - item is not none
