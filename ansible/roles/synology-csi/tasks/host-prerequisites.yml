---
# ansible/roles/synology-csi/tasks/host-prerequisites.yml
# Purpose: Install/enable the iSCSI initiator on every node so kubelet can mount
# Synology iSCSI-backed PersistentVolumes. The Synology CSI node plugin execs the
# host's iscsiadm (via hostPath/nsenter) to log into targets — without it, PVC-using
# pods hang in ContainerCreating forever with:
#   "Failed to login with target iqn ...: env: can't execute 'iscsiadm':
#    No such file or directory (exit status 127)"
# Reference: FR-015, Contract C-005
# Must run against the full k3s_cluster group (any node may schedule a PVC-using
# pod) — unlike the rest of this role, which only applies manifests via the API
# from k3s_servers[0].

- name: Determine whether any iSCSI-protocol StorageClass is configured
  ansible.builtin.set_fact:
    synology_csi_iscsi_in_use: "{{ (synology_csi_storage_classes | default([]) | selectattr('protocol', 'equalto', 'iscsi') | list | length) > 0 }}"

- name: Install open-iscsi (provides iscsiadm/iscsid required by the Synology CSI iSCSI node plugin)
  ansible.builtin.apt:
    name: open-iscsi
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - ansible_facts.os_family == 'Debian'
    - synology_csi_iscsi_in_use

- name: Ensure iscsid.socket is enabled and running (socket-activates iscsid on demand)
  ansible.builtin.systemd:
    name: iscsid.socket
    enabled: true
    state: started
  when: synology_csi_iscsi_in_use
