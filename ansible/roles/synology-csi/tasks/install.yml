---
# ansible/roles/synology-csi/tasks/install.yml
# Purpose: Deploy complete Synology CSI driver stack
# Reference: FR-015, Contract C-005
# Components: namespace, client-info secret, node DaemonSet, controller,
#             snapshotter (optional), StorageClasses, VolumeSnapshotClass (optional)

- name: Create Synology CSI namespace
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'namespace.yaml.j2') | from_yaml }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml

- name: Create CSI node ServiceAccount
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: csi-node-sa
        namespace: "{{ synology_csi_namespace }}"

- name: Create CSI controller ServiceAccount
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: csi-controller-sa
        namespace: "{{ synology_csi_namespace }}"

- name: Create CSI controller ClusterRole
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: synology-csi-controller-role
      rules:
        - apiGroups: [""]
          resources: ["events"]
          verbs: ["get", "list", "watch", "create", "update", "patch"]
        - apiGroups: [""]
          resources: ["persistentvolumes"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: [""]
          resources: ["persistentvolumeclaims"]
          verbs: ["get", "list", "watch", "update", "patch"]
        - apiGroups: [""]
          resources: ["persistentvolumeclaims/status"]
          verbs: ["update", "patch"]
        - apiGroups: [""]
          resources: ["nodes"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["storage.k8s.io"]
          resources: ["storageclasses"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["storage.k8s.io"]
          resources: ["volumeattachments"]
          verbs: ["get", "list", "watch", "update", "patch"]
        - apiGroups: ["storage.k8s.io"]
          resources: ["volumeattachments/status"]
          verbs: ["patch"]
        - apiGroups: ["storage.k8s.io"]
          resources: ["csinodes"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["snapshot.storage.k8s.io"]
          resources: ["volumesnapshotclasses"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["snapshot.storage.k8s.io"]
          resources: ["volumesnapshotcontents"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: ["snapshot.storage.k8s.io"]
          resources: ["volumesnapshotcontents/status"]
          verbs: ["update", "patch"]
        - apiGroups: ["snapshot.storage.k8s.io"]
          resources: ["volumesnapshots"]
          verbs: ["get", "list", "watch", "update", "patch"]
        - apiGroups: ["snapshot.storage.k8s.io"]
          resources: ["volumesnapshots/status"]
          verbs: ["update", "patch"]

- name: Create CSI controller ClusterRoleBinding
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: synology-csi-controller-binding
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: synology-csi-controller-role
      subjects:
        - kind: ServiceAccount
          name: csi-controller-sa
          namespace: "{{ synology_csi_namespace }}"

- name: Create CSI node ClusterRole
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: synology-csi-node-role
      rules:
        - apiGroups: [""]
          resources: ["events"]
          verbs: ["get", "list", "watch", "create", "update", "patch"]

- name: Create CSI node ClusterRoleBinding
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: synology-csi-node-binding
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: synology-csi-node-role
      subjects:
        - kind: ServiceAccount
          name: csi-node-sa
          namespace: "{{ synology_csi_namespace }}"

- name: Create CSIDriver object
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: storage.k8s.io/v1
      kind: CSIDriver
      metadata:
        name: csi.san.synology.com
      spec:
        attachRequired: true
        podInfoOnMount: true
        volumeLifecycleModes:
          - Persistent

- name: Deploy client-info secret
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'client-info-secret.yaml.j2') | from_yaml }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  no_log: true

- name: Deploy Synology CSI node DaemonSet
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'node-daemonset.yaml.j2') | from_yaml }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml

- name: Deploy Synology CSI controller
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'controller.yaml.j2') | from_yaml }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml

- name: Deploy snapshotter controller
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'snapshotter.yaml.j2') | from_yaml }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  when: synology_csi_snapshots_enabled | default(false)

- name: Install VolumeSnapshot CRDs
  kubernetes.core.k8s:
    state: present
    src: "https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{{ synology_csi_snapshotter_version }}/client/config/crd/{{ item }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  loop:
    - snapshot.storage.k8s.io_volumesnapshotclasses.yaml
    - snapshot.storage.k8s.io_volumesnapshotcontents.yaml
    - snapshot.storage.k8s.io_volumesnapshots.yaml
  when: synology_csi_snapshots_enabled | default(false)

- name: Create iSCSI StorageClasses
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'storageclass-iscsi.yaml.j2') | from_yaml }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  loop: "{{ synology_csi_storage_classes | selectattr('protocol', 'equalto', 'iscsi') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create NFS StorageClasses
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'storageclass-nfs.yaml.j2') | from_yaml }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  loop: "{{ synology_csi_storage_classes | selectattr('protocol', 'equalto', 'nfs') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create VolumeSnapshotClass
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'volumesnapshotclass.yaml.j2') | from_yaml }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  when: synology_csi_snapshots_enabled | default(false)

- name: Wait for CSI node DaemonSet to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: DaemonSet
    name: synology-csi-node
    namespace: "{{ synology_csi_namespace }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  register: synology_node_ds
  until: >-
    (synology_node_ds.get('resources', []) | length) > 0 and
    (((synology_node_ds.get('resources', [{'status': {}}]))[0].status.numberReady | default(0)) | int) ==
    (((synology_node_ds.get('resources', [{'status': {}}]))[0].status.desiredNumberScheduled | default(1)) | int)
  retries: 30
  delay: 10
  failed_when: false

- name: Wait for CSI controller to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    name: synology-csi-controller
    namespace: "{{ synology_csi_namespace }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  register: synology_controller
  until: >-
    (synology_controller.get('resources', []) | length) > 0 and
    (((synology_controller.get('resources', [{'status': {}}]))[0].status.readyReplicas | default(0)) | int) >=
    (synology_csi_replicas | default(1) | int)
  retries: 30
  delay: 10

- name: Wait for stable DSM API connectivity from CSI controller pod
  # Fresh installs can have transient CNI/egress-gateway datapath flakiness that manifests as
  # intermittent "connection reset by peer" from the DSM webapi even once the pod is Ready.
  # Require several consecutive successful probes before returning, so StorageClass/PVC
  # provisioning doesn't race against a network path that hasn't settled yet.
  ansible.builtin.shell: >-
    set -e; for i in $(seq 1 {{ synology_csi_dsm_ready_check_count }}); do
    kubectl exec -n {{ synology_csi_namespace }} statefulset/synology-csi-controller -c csi-driver --
    wget -q -O /dev/null --no-check-certificate --timeout=5
    'https://{{ synology_csi_endpoint }}:{{ synology_csi_port }}/webapi/query.cgi?api=SYNO.API.Info&method=query&version=1'
    || exit 1; sleep 2; done
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: synology_csi_dsm_ready
  until: synology_csi_dsm_ready.rc == 0
  retries: "{{ synology_csi_dsm_ready_retries }}"
  delay: "{{ synology_csi_dsm_ready_delay }}"
  changed_when: false
  when: synology_csi_dsm_ready_check_enabled | bool

- name: Ensure the CSI controller's one-shot DSM login actually succeeded, restarting it if not
  # synok8scsiplugin logs in to each configured DSM exactly once at process startup
  # ("Failed to add DSM: <host>" in the csi-driver container log) and never retries for the
  # life of the pod. The connectivity probe above confirms the *network path* is stable now,
  # but a pod that started before the network settled still has zero DSM hosts registered in
  # memory and will fail every CreateVolume with "Couldn't find any host available to create
  # Volume" forever. Detect that startup failure signature and restart the pod(s) to force a
  # fresh login attempt now that connectivity is confirmed.
  ansible.builtin.shell: |
    set -eu
    # No pipefail: `grep -q` exits on first match, SIGPIPE-ing the still-writing `kubectl logs`
    # upstream — under pipefail that 141 would become the pipe's status instead of grep's own,
    # masking a real match as "not found".
    ns="{{ synology_csi_namespace }}"
    for attempt in $(seq 1 {{ synology_csi_dsm_login_retry_attempts }}); do
      bad_pods=""
      for pod in $(kubectl get pods -n "$ns" -o name | grep '^pod/synology-csi-controller-' | sed 's#pod/##'); do
        if kubectl logs "$pod" -n "$ns" -c csi-driver 2>/dev/null | grep -q 'Failed to add DSM'; then
          bad_pods="$bad_pods $pod"
        fi
      done
      if [ -z "$bad_pods" ]; then
        echo "All CSI controller pods have a clean DSM login"
        exit 0
      fi
      echo "Restarting pods with failed DSM login (attempt $attempt):$bad_pods"
      for pod in $bad_pods; do
        kubectl delete pod "$pod" -n "$ns" --wait=true --timeout=120s
      done
      kubectl rollout status statefulset/synology-csi-controller -n "$ns" \
        --timeout={{ synology_csi_dsm_login_retry_wait }}s
      sleep 5
    done
    echo "DSM login still failing on one or more controller pods after {{ synology_csi_dsm_login_retry_attempts }} restart(s)"
    exit 1
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: synology_csi_dsm_login_check
  changed_when: "'Restarting pods' in synology_csi_dsm_login_check.stdout"
  when: synology_csi_dsm_ready_check_enabled | bool

- name: Apply synology-csi DSM login reconciler CronJob
  # Ongoing self-heal for the same one-shot DSM login failure, since it can recur any time the
  # controller pod restarts during normal operation (node drain/eviction/upgrade), not just on
  # a fresh install — this covers the gap between ansible runs. See templates/
  # synology-csi-dsm-login-reconciler-cronjob.yaml.j2 for the detection/recovery logic.
  kubernetes.core.k8s:
    definition: "{{ item }}"
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  loop: "{{ lookup('template', 'synology-csi-dsm-login-reconciler-cronjob.yaml.j2') | from_yaml_all | list }}"
  loop_control:
    label: "{{ item.kind | default('Resource') }}/{{ item.metadata.name | default('unnamed') }}"
  when:
    - synology_csi_dsm_login_reconciler_enabled | bool
    - item is not none
