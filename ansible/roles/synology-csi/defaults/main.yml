---
# ansible/roles/synology-csi/defaults/main.yml
# Synology CSI driver configuration
# Reference: FR-015, data-model SynologyCsiConfig

# Enable/disable Synology CSI deployment
synology_csi_enabled: false

# CSI driver version/tag
synology_csi_version: "v1.2.1"

# Dedicated namespace for all Synology CSI components
synology_csi_namespace: "synology-csi"

# NAS connection settings (HTTPS with self-signed cert support)
synology_csi_endpoint: ""
synology_csi_port: 8443
synology_csi_tls_verify: false

# Liveness probe on the csi-driver container(s) checking DSM reachability. This only reacts to
# *sustained* future outages (kubelet restarts the container after failureThreshold consecutive
# failures) — it cannot detect a one-shot startup login that already failed and then the network
# recovered, since the probe only reflects current reachability. The dsm-login-reconciler
# CronJob (see tasks/install.yml) is what catches that specific case; this probe is a faster-
# reacting complement for genuine ongoing connectivity loss, not a replacement for it.
synology_csi_liveness_probe_enabled: true
synology_csi_liveness_probe_initial_delay: 30
synology_csi_liveness_probe_period: 30
synology_csi_liveness_probe_timeout: 10
synology_csi_liveness_probe_failure_threshold: 3

# Credentials — store in Ansible Vault
synology_csi_username: ""
synology_csi_password: ""

# Post-deploy readiness gate: probe the DSM API from the controller pod and require
# several consecutive successes before the role returns (see synology_csi_dsm_ready_*
# task in tasks/install.yml). Guards against transient fresh-install network flakiness
# racing against StorageClass/PVC provisioning.
synology_csi_dsm_ready_check_enabled: true
synology_csi_dsm_ready_check_count: 5    # consecutive successful probes required
synology_csi_dsm_ready_retries: 20       # ansible-level retries if the streak is broken

# synok8scsiplugin logs in to each configured DSM exactly once at process startup and never
# retries for the life of the pod. If that one-shot login failed (e.g. the network path wasn't
# stable yet), CreateVolume then permanently fails with "Couldn't find any host available to
# create Volume" no matter how healthy the network becomes afterward — the pod must be
# restarted to force a fresh login attempt. See tasks/install.yml.
synology_csi_dsm_login_retry_attempts: 3
synology_csi_dsm_login_retry_wait: 120   # seconds to wait for the StatefulSet rollout after a restart
synology_csi_dsm_ready_delay: 15         # seconds between ansible-level retries

# Ongoing in-cluster reconciliation for the same one-shot DSM login failure (see above), since
# it can recur any time the controller pod restarts during normal operation (node drain/
# eviction, node failure, rolling upgrade) — not just on a fresh install — and nothing else
# triggers a reconciliation until someone next runs this ansible playbook. Deploys a CronJob
# (see templates/synology-csi-dsm-login-reconciler-cronjob.yaml.j2) that periodically checks
# for and self-heals the same failure signature independently of ansible runs.
synology_csi_dsm_login_reconciler_enabled: true
synology_csi_dsm_login_reconciler_schedule: "*/5 * * * *"
synology_csi_dsm_login_reconciler_image: "alpine/kubectl:1.36.4"
synology_csi_dsm_login_reconciler_history_limit: 3

# Snapshot support
synology_csi_snapshots_enabled: false
synology_csi_snapshotter_version: "v8.5.0"

# Storage classes — list of definitions supporting iSCSI and/or NFS
# Each entry:
#   name: StorageClass name
#   protocol: "iscsi" or "nfs"
#   is_default: true/false (at most one default)
#   reclaim_policy: "Delete" or "Retain"
#   volume_binding_mode: "Immediate" or "WaitForFirstConsumer"
#   parameters: protocol-specific parameters dict
#   parameters.location: DSM volume root path (e.g. /volume1), not a subfolder path
synology_csi_storage_classes:
  - name: "synology-iscsi-retain"
    protocol: "iscsi"
    is_default: true
    reclaim_policy: "Retain"
    volume_binding_mode: "Immediate"
    parameters:
      fsType: "ext4"
      location: "/volume1"
  - name: "synology-nfs-retain"
    protocol: "nfs"
    is_default: false
    reclaim_policy: "Retain"
    volume_binding_mode: "Immediate"
    parameters:
      location: "/volume1"

# CSI driver images
synology_csi_node_driver_image: "synology/synology-csi:{{ synology_csi_version }}"
synology_csi_controller_image: "synology/synology-csi:{{ synology_csi_version }}"

# csi-driver-nfs (kubernetes-csi/csi-driver-nfs) for NFS sub-directory provisioning
# Reference: FR-018, R-014, data-model SynologyCsiConfig.csi_nfs_*
csi_nfs_enabled: false
csi_nfs_version: "v4.13.2"

# NFS sub-directory storage classes — list of definitions
# Each entry:
#   name: StorageClass name
#   server: NFS server address
#   share: NFS export path (pre-existing share on NAS)
#   is_default: true/false (at most one default)
#   reclaim_policy: "Delete" or "Retain"
#   volume_binding_mode: "Immediate" or "WaitForFirstConsumer"
#   sub_dir: sub-directory template (default: "${pv.metadata.name}")
#   on_delete: "retain" or "delete" — action on PV deletion
#   mount_options: list of NFS mount options (default: ["hard", "nfsvers=4.1"])
csi_nfs_storage_classes:
  - name: "nfs-subdir"
    server: "{{ synology_csi_endpoint }}"
    share: "/volume1/k8s-nfs"
    is_default: false
    reclaim_policy: "Retain"
    volume_binding_mode: "Immediate"
    sub_dir: "${pv.metadata.name}"
    on_delete: "retain"
    mount_options:
      - hard
      - nfsvers=4.1
