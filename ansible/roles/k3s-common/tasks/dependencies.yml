---
# ansible/roles/k3s-common/tasks/dependencies.yml
# Purpose: Install common dependencies required by k3s
# Reference: docs/ansible-structure.md

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == 'Debian'

- name: Install required packages for k3s
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - apt-transport-https
      - software-properties-common
      - iptables
      - python3
      - python3-pip
    state: present
  when: ansible_facts.os_family == 'Debian'

- name: Install kubernetes Python library for kubernetes.core modules
  ansible.builtin.pip:
    name: kubernetes>=24.2.0
    state: present
    extra_args: --break-system-packages --ignore-installed

- name: Ensure systemd is running
  ansible.builtin.systemd:
    daemon_reload: true

- name: Check if Helm is installed
  ansible.builtin.command: helm version --short
  register: helm_check
  changed_when: false
  failed_when: false

- name: Download Helm install script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get-helm-3.sh
    mode: '0755'
  when: helm_check.rc != 0

- name: Install Helm
  ansible.builtin.command: /tmp/get-helm-3.sh
  args:
    creates: /usr/local/bin/helm
  when: helm_check.rc != 0

- name: Remove Helm install script
  ansible.builtin.file:
    path: /tmp/get-helm-3.sh
    state: absent
  when: helm_check.rc != 0

- name: Check installed Helm plugins
  ansible.builtin.command: helm plugin list
  register: helm_plugin_list
  changed_when: false

- name: Install helm-diff plugin for reliable Helm idempotency checks
  ansible.builtin.command: helm plugin install https://github.com/databus23/helm-diff --version v3.9.12
  when: not (helm_plugin_list.stdout is search('(?m)^diff\s'))

- name: Ensure k3s containerd config fragment directory exists
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d
    state: directory
    mode: "0755"

- name: Create containerd CNI paths config fragment
  # k3s imports config-v3.toml.d/*.toml into its generated containerd config.
  # Keep containerd on k3s-managed CNI paths; do not create a second CNI installation
  # in the generic /etc/cni/net.d or /opt/cni/bin locations.
  ansible.builtin.copy:
    dest: "/var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d/cni-plugin-dirs.toml"
    mode: "0644"
    content: |
      # k3s CNI plugin directory configuration
      # Source: ansible/roles/k3s-common/tasks/dependencies.yml
      [plugins.'io.containerd.cri.v1.runtime'.cni]
        conf_dir = "/var/lib/rancher/k3s/agent/etc/cni/net.d"
        bin_dirs = ["/var/lib/rancher/k3s/data/cni"]
  register: containerd_cni_config

- name: Create containerd shim timeouts config fragment
  # Default shim.cleanup/load (5s), shim.shutdown (3s), and task.state (2s) timeouts are
  # too tight under the I/O/CPU pressure of mass concurrent pod churn (e.g. node-wide
  # NoExecute taint evictions), leading to leaky shims and stuck CRI exec/sandbox calls.
  # See containerd/containerd#6080 for the failure mode and this workaround.
  ansible.builtin.copy:
    dest: "/var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d/shim-timeouts.toml"
    mode: "0644"
    content: |
      # Mitigates leaky-shim/stuck-exec issues under high pod churn (containerd/containerd#6080)
      # Source: ansible/roles/k3s-common/tasks/dependencies.yml
      [timeouts]
        "io.containerd.timeout.shim.cleanup" = "30s"
        "io.containerd.timeout.shim.load" = "30s"
        "io.containerd.timeout.shim.shutdown" = "30s"
        "io.containerd.timeout.task.state" = "30s"
  register: containerd_shim_timeouts_config

- name: Check whether k3s is installed before reloading containerd configuration
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary_for_cni_config

- name: Reload k3s after changing native containerd configuration fragments
  ansible.builtin.systemd:
    name: k3s
    state: restarted
  when:
    - k3s_binary_for_cni_config.stat.exists
    - (containerd_cni_config is changed) or (containerd_shim_timeouts_config is changed)
