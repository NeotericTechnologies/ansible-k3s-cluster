---
# Traefik ingress configuration (Traefik app/image version, not Helm chart version)
# https://github.com/traefik/traefik/releases
traefik_enabled: true  # k3s includes Traefik by default, role configures it
traefik_version: "v3.7.13" # Lastest as of 2026.09.19
# traefik_version: "v3.7.7" # Latest as of 2026.07.11
# traefik_version: "v3.7.4" # Default for K3S v1.35.6+k3s1
# traefik_version: "v3.6.13" # Default for K3S v1.35.4+k3s1

traefik_service_type: "LoadBalancer"  # Uses kube-vip for LoadBalancer services
traefik_ha_min_replicas: 3
traefik_non_ha_default_replicas: 1
traefik_entrypoints:
  - web
  - websecure
