---
# kube-vip configuration for control-plane VIP and service load balancing
kube_vip_enabled: true
# https://github.com/kube-vip/kube-vip/releases
# v1.1.2 lacks the kube-vip.io/has-ip leader-election node labeling feature
# (required by kube_vip_egress_gateway_node_selector) -- v1.2.1+ required when kube_vip_egress_enabled: true
# v1.2.3 fixes a leader-election deadlock for backend-less (zero-endpoint) LoadBalancer
# Services such as egress-gateway-svc (kube-vip#1668, #1650)
kube_vip_version: "v1.2.4"
# kube_vip_version: "v1.2.3"

# https://github.com/kube-vip/kube-vip-cloud-provider/releases
kube_vip_cloud_provider_version: "v0.0.12"

# kubectl image (alpine/kubectl) used only by the label-reconciler CronJob
# https://hub.docker.com/r/alpine/kubectl/tags
kube_vip_label_reconciler_kubectl_version: "1.37.0"
# kube_vip_label_reconciler_kubectl_version: "1.36.4"

kube_vip_ha_min_replicas: 2
kube_vip_non_ha_default_replicas: 1
kube_vip_lb_enable: true
kube_vip_lb_dhcp_enabled: false

# kube-vip service leader election (auto-enabled when kube_vip_egress_enabled: true)
kube_vip_svc_election_enabled: false
vip_leaseduration: 15
vip_renewdeadline: 10
vip_retryperiod: 2

# Labels the current VIP-holding node for kube-vip-managed services (auto-enabled when
# kube_vip_egress_enabled: true — see kube_vip_egress_gateway_node_selector)
kube_vip_enable_node_labeling: false

# kube-vip egress gateway (combined with Cilium CiliumEgressGatewayPolicy)
kube_vip_egress_enabled: false
kube_vip_egress_namespace: "kube-system"
kube_vip_egress_policy_name: "egress-gateway-policy"
kube_vip_egress_pod_selector: {}
kube_vip_egress_namespace_selector: {}
kube_vip_egress_destination_cidrs:
  - "0.0.0.0/0"
# Matches only the node kube-vip currently elected leader for egress-gateway-svc (requires
# kube_vip_enable_node_labeling: true) — see ansible/roles/kube-vip/README.md
kube_vip_egress_gateway_node_selector:
  service-provided.kube-vip.io/egress-gateway-svc.kube-system: "{{ kube_vip_egress_ip }}"
kube_vip_egress_gateway_interface: "{{ kube_vip_interface }}"

# Sensitive information: maintain actual values as overrides in your private
# ansible-k3s-cluster-ops repository and encrypt them with Ansible Vault.
kube_vip_interface: "eth0"
kube_vip_lb_ip_range: "192.168.1.200-192.168.1.220"
kube_vip_egress_ip: ""
kube_vip_egress_hostname: ""
