---
# Shared by site.yml and the cluster smoke test.

- name: Collect live component versions
  ansible.builtin.shell: "set -o pipefail; {{ item.command }}"
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  loop:
    - key: k3s_version
      command: "k3s --version | head -n1 | awk '{print $3}'"
    - key: kube_vip_version
      command: "kubectl get ds kube-vip -n kube-system -o jsonpath='{.spec.template.spec.containers[0].image}' | sed -E 's/.*:(v[0-9]+\\.[0-9]+\\.[0-9]+).*/\\1/'"
    - key: kube_vip_cloud_provider_version
      command: "kubectl get deploy kube-vip-cloud-controller -n kube-system -o jsonpath='{.spec.template.spec.containers[0].image}' | sed -E 's/.*:(v[0-9]+\\.[0-9]+\\.[0-9]+).*/\\1/'"
    - key: kube_vip_label_reconciler_kubectl_version
      command: "kubectl get cronjob kube-vip-label-reconciler -n kube-system -o jsonpath='{.spec.jobTemplate.spec.template.spec.containers[0].image}' | sed -E 's/.*:([0-9]+\\.[0-9]+\\.[0-9]+).*/\\1/'"
    - key: smoke_test_image
      command: "kubectl get cronjob kube-vip-label-reconciler -n kube-system -o jsonpath='{.spec.jobTemplate.spec.template.spec.containers[0].env[?(@.name==\"VIP_CHECK_IMAGE\")].value}'"
    - key: cilium_version
      command: "kubectl get ds cilium -n kube-system -o jsonpath='{.spec.template.spec.containers[0].image}' | sed -E 's/.*:(v[0-9]+\\.[0-9]+\\.[0-9]+).*/\\1/'"
    - key: cert_manager_version
      command: "kubectl get deploy cert-manager -n cert-manager -o jsonpath='{.spec.template.spec.containers[0].image}' | sed -E 's/.*:(v[0-9]+\\.[0-9]+\\.[0-9]+).*/\\1/'"
    - key: multus_version
      command: "kubectl get ds kube-multus-ds -n kube-system -o jsonpath='{.spec.template.spec.initContainers[0].image}' | sed -E 's/.*:(v[0-9]+\\.[0-9]+\\.[0-9]+-thick).*/\\1/'"
    - key: multus_cni_config_version
      command: >-
        { kubectl get configmap multus-daemon-config -n kube-system
        -o jsonpath='{.data.daemon-config\.json}'; printf '\n';
        kubectl get network-attachment-definitions --all-namespaces
        -o jsonpath='{range .items[*]}{.spec.config}{"\n"}{end}'; }
        | sed -n 's/.*"cniVersion"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p'
        | sort -u | paste -sd, -
    - key: multus_dhcp_daemon_image
      command: "kubectl get ds multus-dhcp-daemon -n kube-system -o jsonpath='{.spec.template.spec.containers[0].image}'"
    - key: multus_cni_plugins_version
      command: "kubectl get ds multus-dhcp-daemon -n kube-system -o jsonpath='{.spec.template.spec.initContainers[0].command[2]}' | sed -n 's/.*DESIRED_VERSION=\"\\([^\"]*\\)\".*/\\1/p'"
    - key: rancher_version
      command: "kubectl get deploy rancher -n cattle-system -o jsonpath='{.spec.template.spec.containers[0].image}' | sed -E 's/.*:v?([0-9]+\\.[0-9]+\\.[0-9]+).*/\\1/'"
    - key: rancher_monitoring_version
      command: >-
        helm list -n cattle-monitoring-system -o json
        | python3 -c 'import json,sys; print(next((r["chart"].replace("rancher-monitoring-", "", 1) for r in json.load(sys.stdin) if r["name"] == "rancher-monitoring"), ""))'
    - key: traefik_version
      command: "kubectl get deploy traefik -n kube-system -o jsonpath='{.spec.template.spec.containers[0].image}' | sed -E 's/.*:(v[0-9]+\\.[0-9]+\\.[0-9]+).*/\\1/'"
    - key: synology_csi_version
      command: "kubectl get sts synology-csi-controller -n synology-csi -o jsonpath='{.spec.template.spec.containers[0].image}' | sed -E 's/.*:(v[0-9]+\\.[0-9]+\\.[0-9]+).*/\\1/'"
    - key: synology_csi_node_driver_version
      command: >-
        kubectl get ds synology-csi-node -n synology-csi
        -o jsonpath='{.spec.template.spec.containers[?(@.name=="csi-driver")].image}'
        | sed -E 's/.*:(v[0-9]+\.[0-9]+\.[0-9]+).*/\1/'
    - key: synology_csi_node_driver_registrar_version
      command: >-
        kubectl get ds synology-csi-node -n synology-csi
        -o jsonpath='{.spec.template.spec.containers[?(@.name=="csi-node-driver-registrar")].image}'
        | sed -E 's/.*:v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/'
    - key: synology_csi_provisioner_version
      command: >-
        kubectl get sts synology-csi-controller -n synology-csi
        -o jsonpath='{.spec.template.spec.containers[?(@.name=="csi-provisioner")].image}'
        | sed -E 's/.*:v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/'
    - key: synology_csi_attacher_version
      command: >-
        kubectl get sts synology-csi-controller -n synology-csi
        -o jsonpath='{.spec.template.spec.containers[?(@.name=="csi-attacher")].image}'
        | sed -E 's/.*:v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/'
    - key: synology_csi_resizer_version
      command: >-
        kubectl get sts synology-csi-controller -n synology-csi
        -o jsonpath='{.spec.template.spec.containers[?(@.name=="csi-resizer")].image}'
        | sed -E 's/.*:v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/'
    - key: synology_csi_snapshotter_sidecar_version
      command: >-
        kubectl get sts synology-csi-controller -n synology-csi
        -o jsonpath='{.spec.template.spec.containers[?(@.name=="csi-snapshotter")].image}'
        | sed -E 's/.*:v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/'
    - key: synology_csi_snapshotter_version
      command: "kubectl get deploy synology-csi-snapshotter -n synology-csi -o jsonpath='{.spec.template.spec.containers[0].image}' | sed -E 's/.*:(v[0-9]+\\.[0-9]+\\.[0-9]+).*/\\1/'"
    - key: synology_csi_dsm_login_reconciler_kubectl_version
      command: >-
        kubectl get cronjob synology-csi-dsm-login-reconciler -n synology-csi
        -o jsonpath='{.spec.jobTemplate.spec.template.spec.containers[?(@.name=="reconcile")].image}'
        | sed -E 's/.*:([0-9]+\.[0-9]+\.[0-9]+).*/\1/'
    - key: csi_nfs_version
      command: "kubectl get deploy csi-nfs-controller -n kube-system -o jsonpath='{range .spec.template.spec.containers[*]}{.image}{\"\\n\"}{end}' | sed -n 's/.*nfsplugin:\\(v[0-9.]*\\).*/\\1/p'"
  register: version_audit_probe_results
  changed_when: false
  failed_when: false

- name: Collect Helm plugins as the install user
  ansible.builtin.command: helm plugin list
  become: true
  register: version_audit_helm_plugins
  changed_when: false
  failed_when: false

- name: Build live version map
  ansible.builtin.set_fact:
    version_audit_probe_map: >-
      {{ dict(version_audit_probe_results.results
              | map(attribute='item.key')
              | zip(version_audit_probe_results.results))
         | combine({'helm_diff_plugin_version': {
             'rc': version_audit_helm_plugins.rc | default(0),
             'stderr': version_audit_helm_plugins.stderr | default(''),
             'stdout': version_audit_helm_plugins.stdout_lines
               | default([])
               | select('match', '^diff\s')
               | map('regex_replace', '^diff\s+v?(\S+).*$', '\1')
               | first
               | default('Not installed')
           }}) }}
    version_audit_live_versions: >-
      {{ dict(version_audit_probe_results.results
              | map(attribute='item.key')
              | zip(version_audit_probe_results.results
                    | map(attribute='stdout')))
         | combine({'helm_diff_plugin_version':
             version_audit_helm_plugins.stdout_lines
             | default([])
             | select('match', '^diff\s')
             | map('regex_replace', '^diff\s+v?(\S+).*$', '\1')
             | first
             | default('Not installed')}) }}

- name: Build desired versus live version checks
  ansible.builtin.set_fact:
    version_audit_checks:
      - name: k3s_version
        desired: "{{ k3s_version }}"
        live: "{{ version_audit_live_versions.k3s_version | trim }}"
      - name: kube_vip_version
        enabled: "{{ kube_vip_enabled | default(true) | bool }}"
        desired: "{{ kube_vip_version }}"
        live: "{{ version_audit_live_versions.kube_vip_version | trim }}"
      - name: kube_vip_cloud_provider_version
        enabled: "{{ kube_vip_enabled | default(true) | bool and kube_vip_lb_enable | default(true) | bool }}"
        desired: "{{ kube_vip_cloud_provider_version }}"
        live: "{{ version_audit_live_versions.kube_vip_cloud_provider_version | trim }}"
        parent_component: kube_vip
      - name: kube_vip_label_reconciler_kubectl_version
        enabled: "{{ kube_vip_enabled | default(true) | bool and (kube_vip_enable_node_labeling | default(false) | bool or kube_vip_egress_enabled | default(false) | bool) and kube_vip_label_reconciler_enabled | default(true) | bool }}"
        desired: "{{ alpine_kubectl_version }}"
        live: "{{ version_audit_live_versions.kube_vip_label_reconciler_kubectl_version | trim }}"
        parent_component: kube_vip
      - name: smoke_test_image
        enabled: "{{ kube_vip_enabled | default(true) | bool and (kube_vip_enable_node_labeling | default(false) | bool or kube_vip_egress_enabled | default(false) | bool) and kube_vip_label_reconciler_enabled | default(true) | bool }}"
        desired: "{{ smoke_test_image }}"
        live: "{{ version_audit_live_versions.smoke_test_image | trim }}"
        parent_component: kube_vip
      - name: cilium_version
        enabled: "{{ cilium_enabled | default(true) | bool }}"
        desired: "{{ cilium_version }}"
        live: "{{ version_audit_live_versions.cilium_version | trim }}"
      - name: helm_diff_plugin_version
        desired: "{{ helm_diff_plugin_version | regex_replace('^v', '') }}"
        live: "{{ version_audit_live_versions.helm_diff_plugin_version | trim }}"
        parent_component: common_dependencies
      - name: cert_manager_version
        enabled: "{{ cert_manager_enabled | default(false) | bool }}"
        desired: "{{ cert_manager_version }}"
        live: "{{ version_audit_live_versions.cert_manager_version | trim }}"
      - name: multus_version
        enabled: "{{ multus_enabled | default(false) | bool }}"
        desired: "{{ multus_version }}"
        live: "{{ version_audit_live_versions.multus_version | trim }}"
      - name: multus_cni_config_version
        enabled: "{{ multus_enabled | default(false) | bool }}"
        desired: "{{ multus_cni_config_version }}"
        live: "{{ version_audit_live_versions.multus_cni_config_version | trim }}"
        parent_component: multus
      - name: multus_dhcp_daemon_image
        enabled: "{{ multus_enabled | default(false) | bool and multus_dhcp_daemon_enabled | default(true) | bool }}"
        desired: "{{ multus_dhcp_daemon_image }}"
        live: "{{ version_audit_live_versions.multus_dhcp_daemon_image | trim }}"
        parent_component: multus
      - name: multus_cni_plugins_version
        enabled: "{{ multus_enabled | default(false) | bool and multus_dhcp_daemon_enabled | default(true) | bool }}"
        desired: "{{ multus_cni_plugins_version }}"
        live: "{{ version_audit_live_versions.multus_cni_plugins_version | trim }}"
        parent_component: multus
      - name: rancher_version
        enabled: "{{ rancher_enabled | default(false) | bool }}"
        desired: "{{ rancher_version }}"
        live: "{{ version_audit_live_versions.rancher_version | trim }}"
      - name: rancher_monitoring_version
        enabled: "{{ rancher_monitoring_enabled | default(false) | bool }}"
        desired: "{{ rancher_monitoring_version }}"
        live: "{{ version_audit_live_versions.rancher_monitoring_version | trim }}"
      - name: traefik_version
        enabled: "{{ traefik_enabled | default(true) | bool }}"
        desired: "{{ traefik_version }}"
        live: "{{ version_audit_live_versions.traefik_version | trim }}"
      - name: synology_csi_version
        enabled: "{{ synology_csi_enabled | default(false) | bool }}"
        desired: "{{ synology_csi_version }}"
        live: "{{ version_audit_live_versions.synology_csi_version | trim }}"
      - name: synology_csi_node_driver_version
        enabled: "{{ synology_csi_enabled | default(false) | bool }}"
        desired: "{{ synology_csi_version }}"
        live: "{{ version_audit_live_versions.synology_csi_node_driver_version | trim }}"
        parent_component: synology_csi
      - name: synology_csi_node_driver_registrar_version
        enabled: "{{ synology_csi_enabled | default(false) | bool }}"
        desired: "{{ synology_csi_node_driver_registrar_version | regex_replace('^v', '') }}"
        live: "{{ version_audit_live_versions.synology_csi_node_driver_registrar_version | trim }}"
        parent_component: synology_csi
      - name: synology_csi_provisioner_version
        enabled: "{{ synology_csi_enabled | default(false) | bool }}"
        desired: "{{ synology_csi_provisioner_version | regex_replace('^v', '') }}"
        live: "{{ version_audit_live_versions.synology_csi_provisioner_version | trim }}"
        parent_component: synology_csi
      - name: synology_csi_attacher_version
        enabled: "{{ synology_csi_enabled | default(false) | bool }}"
        desired: "{{ synology_csi_attacher_version | regex_replace('^v', '') }}"
        live: "{{ version_audit_live_versions.synology_csi_attacher_version | trim }}"
        parent_component: synology_csi
      - name: synology_csi_resizer_version
        enabled: "{{ synology_csi_enabled | default(false) | bool }}"
        desired: "{{ synology_csi_resizer_version | regex_replace('^v', '') }}"
        live: "{{ version_audit_live_versions.synology_csi_resizer_version | trim }}"
        parent_component: synology_csi
      - name: synology_csi_snapshotter_sidecar_version
        enabled: "{{ synology_csi_enabled | default(false) | bool and synology_csi_snapshots_enabled | default(false) | bool }}"
        desired: "{{ synology_csi_snapshotter_version | regex_replace('^v', '') }}"
        live: "{{ version_audit_live_versions.synology_csi_snapshotter_sidecar_version | trim }}"
        parent_component: synology_csi
      - name: synology_csi_snapshotter_version
        enabled: "{{ synology_csi_enabled | default(false) | bool and synology_csi_snapshots_enabled | default(false) | bool }}"
        desired: "{{ synology_csi_snapshotter_version }}"
        live: "{{ version_audit_live_versions.synology_csi_snapshotter_version | trim }}"
        parent_component: synology_csi
      - name: synology_csi_dsm_login_reconciler_kubectl_version
        enabled: "{{ synology_csi_enabled | default(false) | bool and synology_csi_dsm_login_reconciler_enabled | default(true) | bool }}"
        desired: "{{ alpine_kubectl_version }}"
        live: "{{ version_audit_live_versions.synology_csi_dsm_login_reconciler_kubectl_version | trim }}"
        parent_component: synology_csi
      - name: csi_nfs_version
        enabled: "{{ synology_csi_enabled | default(false) | bool and csi_nfs_enabled | default(false) | bool }}"
        desired: "{{ csi_nfs_version }}"
        live: "{{ version_audit_live_versions.csi_nfs_version | trim }}"
        parent_component: synology_csi

- name: Attach probe results to version checks
  ansible.builtin.set_fact:
    version_audit_checks: >-
      {%- set checks = [] -%}
      {%- for item in version_audit_checks -%}
      {%- set probe = version_audit_probe_map[item.name] -%}
      {%- set _ = checks.append(item | combine({
        'probe_rc': probe.rc | default(0),
        'probe_stderr': probe.stderr | default('')
      })) -%}
      {%- endfor -%}
      {{- checks -}}

- name: Apply component install selection to version checks
  ansible.builtin.set_fact:
    version_audit_checks: >-
      {%- set checks = [] -%}
      {%- for item in version_audit_checks -%}
      {%- set enabled = item.enabled | default(true) | bool -%}
      {%- set _ = checks.append(item | combine({
        'live': item.live if enabled else 'Not selected for install',
        'status': ('OK' if item.desired == item.live else 'DIFF') if enabled else 'SKIP',
        'enabled': enabled
      })) -%}
      {%- endfor -%}
      {{- checks -}}

- name: Validate selected version probes
  ansible.builtin.assert:
    that:
      - >-
        item.probe_stderr is search('(?i)(NotFound|not found|No such file or directory)')
    fail_msg: >-
      Failed to detect {{ item.name }} (rc={{ item.probe_rc }}):
      {{ item.probe_stderr | default('no error output') }}
  loop: "{{ version_audit_checks }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - version_audit_fail_on_probe_errors | default(false) | bool
    - item.enabled | bool
    - item.probe_rc | int != 0
